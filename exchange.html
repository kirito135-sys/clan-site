<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обмен — Legacy II</title><link rel="stylesheet" href="assets/style.css"></head>
<body><header></header><main>
<h1>💱 Обмен через клановое хранилище</h1>
<div class="card" style="border-left:3px solid var(--accent)"><h2>📜 Правила обмена</h2><ul id="rules-box"></ul></div>
<div class="card" style="border-left:3px solid #ffd700"><h2>💰 Курсы</h2><ul id="rates-box"></ul></div>
<div class="card" style="border-left:3px solid #4caf50"><h2>📋 Пример репоста</h2><div id="example-box"></div></div>
</main>
<script src="assets/render.js"></script>
<script>
loadJSON('data/exchange.json').then(d=>{
  document.getElementById('rules-box').innerHTML = d.rules.map(r=>`<li style="margin-bottom:8px">${r}</li>`).join('');
  document.getElementById('rates-box').innerHTML = d.rates.map(r=>`<li style="margin-bottom:8px">${r}</li>`).join('');
  document.getElementById('example-box').innerHTML = `
    <div style="background:#0a0f1f;padding:12px;border-radius:8px;font-family:monospace;border-left:3px solid #4caf50">
      <div style="color:#4caf50;margin-bottom:6px">${d.example.give}</div>
      <div style="color:var(--accent);font-weight:bold">➡️ ${d.example.note}</div>
    </div>`;
});
</script><script src="assets/menu.js"></script>
</body></html>
