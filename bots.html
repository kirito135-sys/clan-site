<h1>🤖 Боты клана</h1>
<p class="muted">Наши Telegram-помощники: что умеют и зачем нужны.</p>
<div id="bots-box"></div>
</main>
<script src="assets/render.js"></script>
<script>
loadJSON('data/bots.json').then(list=>{
  document.getElementById('bots-box').innerHTML = list.map(b=>`
    <div class="card">
      <h2>${b.emoji} ${b.name}</h2>
      <p>${b.desc}</p>
      <ul>${(b.points||[]).map(p=>`<li>${p}</li>`).join('')}</ul>
      ${b.link ? `<a href="${b.link}" target="_blank" class="bot-btn">🚀 Открыть бота</a>` : ''}
    </div>`).join('');
});
</script>
