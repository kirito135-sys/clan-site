<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Боты клана — Legacy II</title><link rel="stylesheet" href="assets/style.css"></head>
<body><header></header><main>
<h1>🤖 Боты клана</h1>
<p class="muted">Наши Telegram-помощники: что умеют и зачем нужны.</p>
<div id="bots-box"></div>
</main>
<script src="assets/render.js"></script>
<script>
loadJSON('data/bots.json').then(list=>{
  document.getElementById('bots-box').innerHTML = list.map(b=>`
    <div class="card">
      <h2>${b.emoji} ${b.name}</h2>
      <p>${b.desc}</p>
      <ul>${(b.points||[]).map(p=>`<li>${p}</li>`).join('')}</ul>
      ${b.link ? `<a href="${b.link}" target="_blank" class="bot-btn">🚀 Открыть бота</a>` : ''}
    </div>`).join('');
});
</script>
<script src="assets/menu.js"></script>
</body></html>
